name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: brew install xcodegen
      - run: scripts/build-dmg.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: build/Ties.dmg
          generate_release_notes: true
